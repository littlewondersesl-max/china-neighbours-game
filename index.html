<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Land Neighbours</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="mode-world">
    <header id="tray-top" class="tray" aria-label="Neighbour tray"></header>
    <main class="workspace">
      <section class="play-wrap">
        <div id="playfield">
          <svg id="graticule" aria-hidden="true"></svg>
          <canvas id="gl"></canvas>
          <svg id="overlay" aria-hidden="true">
            <g id="ghosts"></g>
            <g id="lines"></g>
            <g id="weld"></g>
          </svg>
          <div id="labels"></div>
          <div id="handles"></div>
          <button type="button" id="back" hidden>Back · 返回</button>
          <div id="title"></div>
          <div id="puzzle-tools" hidden>
            <div id="progress" hidden></div>
            <button type="button" id="reveal-map" aria-pressed="false">Reveal map · 显示地图</button>
            <button type="button" id="name-entry" hidden>Enter country name · 输入国名</button>
            <label id="skip-wrap" hidden><input type="checkbox" id="skip-cards" /> Skip cards · 跳过卡片</label>
          </div>
          <div id="mode-choice" hidden>
            <p>Choose a game · 选一种玩法</p>
            <div class="choice-row">
              <button type="button" id="choose-neighbours">Neighbours · 邻国拼图</button>
              <button type="button" id="choose-build">Build Continents · 拼出大洲</button>
            </div>
          </div>
          <p id="hint"></p>
          <div id="island-note" hidden role="status">
            <strong>The remaining countries have no land borders. They are islands! Enter their name and capital to place them.</strong>
            <span>剩下的国家没有陆地邻国，它们是岛国！输入国名和首都来放置它们。</span>
          </div>
          <div id="toast" hidden></div>
        </div>
      </section>
      <aside id="guide" hidden>
        <div class="guide-head">
          <h2>Example map · 示例地图</h2>
          <button type="button" id="guide-close" aria-label="Close map">×</button>
        </div>
        <div id="guide-svg-wrap"></div>
      </aside>
    </main>
    <footer id="tray-bottom" class="tray" aria-label="Neighbour tray"></footer>
  </div>

  <div id="pct" hidden>100%</div>

  <div id="card-modal" hidden>
    <div class="card-panel" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <button type="button" class="icon-x" data-close aria-label="Close">×</button>
      <div class="card-kicker" id="card-kicker"></div>
      <h2 id="card-title"></h2>
      <div id="card-body">
        <div id="card-shape-wrap" class="stage">
          <canvas id="card-gl" width="640" height="340"></canvas>
          <svg id="card-svg" viewBox="0 0 640 340"></svg>
        </div>
        <div id="card-copy">
          <p id="card-en"></p>
          <p id="card-zh"></p>
        </div>
        <div id="card-flag" hidden>
          <div class="flag-stage"><img id="flag-img" alt="" /></div>
          <p id="flag-caption"></p>
        </div>
        <div id="card-photos" class="photo-grid" hidden></div>
      </div>
      <div class="card-nav">
        <button type="button" id="card-back" data-back>Back · 上一张</button>
        <div class="dots" id="card-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <button type="button" id="card-next" data-next>Next · 下一张</button>
      </div>
    </div>
  </div>

  <div id="reward" hidden>
    <div class="reward-panel">
      <p class="reward-count" id="reward-count"></p>
      <p class="reward-en" id="reward-en"></p>
      <p class="reward-zh" id="reward-zh"></p>
      <button type="button" id="reward-back">Back to map · 返回地图</button>
    </div>
  </div>

  <div id="ask" hidden>
    <form id="ask-form" class="ask-panel" autocomplete="off">
      <h2 id="ask-title"></h2>
      <p id="ask-help"></p>
      <input id="ask-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
      <p id="ask-msg" hidden></p>
      <div class="ask-actions">
        <button type="button" id="ask-cancel">Cancel · 取消</button>
        <button type="submit" id="ask-ok">OK · 确定</button>
      </div>
    </form>
  </div>

  <div id="loading">Loading the map…</div>

  <script src="js/vendor/d3-array.min.js"></script>
  <script src="js/vendor/d3-geo.min.js"></script>
  <script src="js/vendor/earcut.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
