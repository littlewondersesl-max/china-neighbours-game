<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Land Neighbours</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="mode-world">
    <header id="tray-top" class="tray" aria-label="Neighbour tray"></header>
    <main class="workspace">
      <section class="play-wrap">
        <div id="playfield">
          <svg id="graticule" aria-hidden="true"></svg>
          <canvas id="gl"></canvas>
          <svg id="overlay" aria-hidden="true">
            <g id="lines"></g>
            <g id="weld"></g>
          </svg>
          <div id="labels"></div>
          <div id="handles"></div>
          <button type="button" id="back" hidden>Back · 返回</button>
          <div id="title"></div>
          <p id="hint"></p>
          <div id="toast" hidden></div>
        </div>
      </section>
      <aside id="guide" hidden>
        <h2>Example map · 示例地图</h2>
        <div id="guide-svg-wrap"></div>
      </aside>
    </main>
    <footer id="tray-bottom" class="tray" aria-label="Neighbour tray"></footer>
  </div>

  <div id="pct" hidden>100%</div>

  <div id="card-modal" hidden>
    <div class="card-panel" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <button type="button" class="icon-x" data-close aria-label="Close">×</button>
      <div class="card-kicker" id="card-kicker"></div>
      <h2 id="card-title"></h2>
      <div id="card-body">
        <div id="card-shape-wrap" class="stage">
          <canvas id="card-gl" width="640" height="340"></canvas>
          <svg id="card-svg" viewBox="0 0 640 340"></svg>
        </div>
        <div id="card-copy">
          <p id="card-en"></p>
          <p id="card-zh"></p>
        </div>
        <div id="card-flag" hidden>
          <div class="flag-stage"><img id="flag-img" alt="" /></div>
          <p id="flag-caption"></p>
        </div>
        <div id="card-photos" class="photo-grid" hidden></div>
      </div>
      <div class="card-nav">
        <button type="button" id="card-back" data-back>Back · 上一张</button>
        <div class="dots" id="card-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <button type="button" id="card-next" data-next>Next · 下一张</button>
      </div>
    </div>
  </div>

  <div id="reward" hidden>
    <div class="reward-panel">
      <p class="reward-count" id="reward-count"></p>
      <p class="reward-en" id="reward-en"></p>
      <p class="reward-zh" id="reward-zh"></p>
      <button type="button" id="reward-back">Back to map · 返回地图</button>
    </div>
  </div>

  <div id="loading">Loading the map…</div>

  <script src="js/vendor/d3-array.min.js"></script>
  <script src="js/vendor/d3-geo.min.js"></script>
  <script src="js/vendor/earcut.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
